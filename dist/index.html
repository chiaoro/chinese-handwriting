<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>生字手寫闖關｜六上國語</title><link rel="stylesheet" href="handwriting.css"></head><body>
<header><strong>生字手寫闖關</strong><span>六上國語 · 獨立練習網站</span><span id="total">自行核對積分 0</span></header>
<main><section id="menu"><div class="hero"><p>六上國語 · 第一至六課</p><h1>看注音，親手寫出國字。</h1><p>用手指或觸控筆在田字格練習；核對後自己判斷書寫結果。</p></div><div class="modes"><button data-mode="basic"><b>基礎描紅</b><span>看語詞與淡字，安心練習</span></button><button data-mode="normal"><b>生字手寫挑戰</b><span>看注音與句子，寫完再核對</span></button><button data-mode="advanced"><b>進階挑戰</b><span>較少提示，連擊得分</span></button><button data-mode="review"><b>錯字再挑戰</b><span>優先練習錯字與待複習字</span></button></div><div class="panel settings"><label>課次 <select id="lesson"><option value="all">全部六課</option></select></label><label>題數 <select id="count"><option value="10">10 題</option><option value="20">20 題</option><option value="all">全部題目</option></select></label><label><input type="checkbox" id="timer"> 進階倒數計時（每題 90 秒）</label><label><input type="checkbox" id="triple"> 錯字每題連寫三次</label><p id="notice" role="status"></p></div><div class="panel"><h2>學習紀錄</h2><p id="stats"></p><p id="lesson-stats"></p><p>紀錄只保存在目前瀏覽器與裝置；可匯出備份、在另一裝置匯入。</p><div class="actions"><button id="export">匯出紀錄</button><label class="file">匯入紀錄<input type="file" id="import" accept="application/json"></label></div></div></section>
<section id="play" hidden><div class="topline"><span id="progress"></span><span id="score"></span><span id="clock"></span></div><div class="progressbar"><i id="fill"></i></div><div class="panel task"><p id="source"></p><h2 id="prompt"></h2><p id="word"></p><p id="sentence"></p><div class="writing"><span id="trace"></span><canvas id="canvas" aria-label="田字格手寫區"></canvas></div><div class="actions"><button id="undo">復原上一筆</button><button id="clear">清空重寫</button><button id="hint">顯示提示</button><button id="submit" class="primary">交卷批改</button></div><p id="task-notice" role="status"></p><div id="grade" hidden><h2>標準答案：<strong id="answer"></strong></h2><p>請看自己的筆跡，選擇最符合的結果。</p><div class="actions"><button data-result="correct">我寫對了</button><button data-result="wrong">我寫錯了</button><button data-result="unsure">不確定</button></div></div></div></section>
<section id="done" hidden><div class="hero"><h1 id="done-title"></h1><p id="done-detail"></p><button id="again" class="primary">返回模式選擇</button></div></section></main><script type="module" src="handwriting.js"></script></body></html>

<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>國語生字手寫本</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
/* 版面：一本作業簿。上方是題目（注音＋語詞），中間一格大田字格給孩子寫，下方固定操作列；家長頁用小格子總覽。
   合併版：以「生字手寫本」為主體，加入「生字手寫闖關」的期中／期末範圍、描紅與進階模式、錯字連寫三次、紀錄備份、離線使用。 */
:root{
  --paper:#f5f6f1; --card:#ffffff; --ink:#1f2620; --muted:#5d685f; --line:#d8ddd4;
  --grid:#c2463a; --grid-soft:#efc9c3; --pen:#1b2a3a; --on:#ffffff;
  --green:#2f7a4c; --green-soft:#e2f1e7; --red:#c2463a; --red-soft:#fbe6e2;
  --gold:#9a6a10; --gold-soft:#fbf0d8; --blue:#2c5a94; --blue-soft:#e3ebf6;
  --f-kai:"BiauKai","DFKai-SB","TW-Kai","Noto Serif TC",serif;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#141814; --card:#1c221d; --ink:#e4ebe5; --muted:#a0ada3; --line:#2f3931;
  --grid:#e2786c; --grid-soft:#4a2b28; --pen:#e9eef5; --on:#141814;
  --green:#7fcb9b; --green-soft:#1d3426; --red:#ff8a7c; --red-soft:#3d221f;
  --gold:#e5b65c; --gold-soft:#352b18; --blue:#8db4ea; --blue-soft:#1e2a3c; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#141814; --card:#1c221d; --ink:#e4ebe5; --muted:#a0ada3; --line:#2f3931;
  --grid:#e2786c; --grid-soft:#4a2b28; --pen:#e9eef5; --on:#141814;
  --green:#7fcb9b; --green-soft:#1d3426; --red:#ff8a7c; --red-soft:#3d221f;
  --gold:#e5b65c; --gold-soft:#352b18; --blue:#8db4ea; --blue-soft:#1e2a3c; color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--paper);color:var(--ink);overscroll-behavior:none}
.board,.board *{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:var(--f-body);font-size:16px;line-height:1.6;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 120px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--card)}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
button:disabled{cursor:default;opacity:.4}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
h1,h2,h3{margin:0;text-wrap:balance;line-height:1.3}
p{margin:0}
.wrap{max-width:760px;margin:0 auto;display:grid;gap:16px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:8;background:var(--card);border-bottom:2px solid var(--grid);margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding:10px max(16px,env(safe-area-inset-left,0px));display:flex;align-items:center;gap:12px}
.top b{flex:1;min-width:0;font-size:17px}
.link{background:none;border:0;padding:6px 0;text-decoration:underline;color:var(--muted);white-space:nowrap}
.saved{font-size:13px;color:var(--muted);white-space:nowrap}
.hero{padding-top:18px;display:grid;gap:6px}
.hero h1{font-family:var(--f-kai);font-size:clamp(30px,7vw,42px)}
.hero p{color:var(--muted)}
.setbox{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 16px;display:grid;gap:10px}
.setrow{display:flex;gap:8px 12px;align-items:center;flex-wrap:wrap}
.setrow>span{font-size:14px;color:var(--muted);min-width:4.5em}
.pills{display:flex;gap:6px;flex-wrap:wrap}
.pills button{border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:5px 14px;font-size:15px}
.pills button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--card);font-weight:700}
.modehint{font-size:13px;color:var(--muted)}
.meter{height:10px;background:var(--line);border-radius:5px;overflow:hidden;display:flex}
.meter i{display:block;height:100%}
.meter .ok{background:var(--green)} .meter .bad{background:var(--red)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px;background:var(--line)}
.legend .lo::before{background:var(--green)} .legend .lb::before{background:var(--red)}
.cta{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{min-height:52px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);font-weight:700;padding:8px 14px}
.btn.primary{background:var(--grid);border-color:var(--grid);color:var(--on)}
.btn.red{border-color:var(--red);color:var(--red)}
.btn.green{border-color:var(--green);color:var(--green)}
.chk{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--muted)}
.chk input{width:20px;height:20px;accent-color:var(--red)}
.lessons{display:grid;gap:10px}
.lesson{display:grid;grid-template-columns:52px 1fr auto;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;text-align:left;width:100%}
.lesson:hover{border-color:var(--grid)}
.lnum{width:52px;height:52px;border:2px solid var(--grid);display:grid;place-items:center;font-family:var(--f-kai);font-size:28px;color:var(--grid);background:
  linear-gradient(90deg,transparent calc(50% - .5px),var(--grid-soft) calc(50% - .5px),var(--grid-soft) calc(50% + .5px),transparent calc(50% + .5px)),
  linear-gradient(transparent calc(50% - .5px),var(--grid-soft) calc(50% - .5px),var(--grid-soft) calc(50% + .5px),transparent calc(50% + .5px))}
.lnum.s{font-size:20px}
.lesson h3{font-size:18px}
.lesson small{color:var(--muted);display:block}
.badge{font-size:13px;font-weight:700;padding:3px 9px;border-radius:6px;background:var(--paper);color:var(--muted);white-space:nowrap}
.badge.done{background:var(--green-soft);color:var(--green)}
.badge.fix{background:var(--red-soft);color:var(--red)}
.today{background:var(--card);border:2px solid var(--grid);border-radius:14px;padding:16px;display:grid;gap:12px}
.today h2{font-family:var(--f-kai);font-size:26px}
.today .row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.today .chips{display:flex;gap:6px;flex-wrap:wrap}
.today .chip{font-family:var(--f-kai);font-size:22px;width:40px;height:40px;display:grid;place-items:center;border:1.5px solid var(--line);border-radius:6px;background:var(--paper)}
.today .chip.ok{border-color:var(--green);background:var(--green-soft);color:var(--green)}
.today .chip.bad{border-color:var(--red);background:var(--red-soft);color:var(--red)}
.today .chip.todo{color:var(--muted)}
.stamp{font-family:var(--f-kai);font-size:20px;color:var(--green);border:2.5px solid var(--green);border-radius:50%;width:64px;height:64px;display:grid;place-items:center;transform:rotate(-8deg);flex:none}
details.more{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 16px}
details.more summary{cursor:pointer;font-weight:700}
.examcard{background:var(--ink);color:var(--card);border-radius:14px;padding:16px;display:grid;gap:10px}
.examcard h2{font-family:var(--f-kai);font-size:26px}
.examcard p{opacity:.85;font-size:15px}
.examcard .btn{background:var(--card);color:var(--ink);border-color:var(--card)}
.examcard .hist{display:flex;gap:6px;flex-wrap:wrap;font-size:13px}
.examcard .hist span{border:1px solid currentColor;border-radius:999px;padding:1px 10px;opacity:.85}
.qgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(46px,1fr));gap:6px}
.qgrid button{height:44px;border:1.5px solid var(--line);background:var(--card);border-radius:6px;font-weight:700}
.qgrid button.done{background:var(--blue-soft);border-color:var(--blue);color:var(--blue)}
.qgrid button.here{outline:3px solid var(--ink)}
.gitem{background:var(--card);border:2px solid var(--line);border-radius:10px;padding:8px;display:grid;gap:6px;justify-items:center}
.pgrid>*{min-width:0}
.gitem.ok{border-color:var(--green)} .gitem.bad{border-color:var(--red)}
.gitem .no{font-size:12px;color:var(--muted)}
.score{display:flex;align-items:center;gap:18px;flex-wrap:wrap;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px}
.score .stampbig{width:120px;height:120px;flex:none;border:5px solid var(--red);border-radius:50%;color:var(--red);display:grid;place-items:center;font-size:46px;font-weight:900;transform:rotate(-7deg);font-variant-numeric:tabular-nums}
.score p{flex:1;min-width:200px}
.how{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;display:grid;gap:8px}
.how ol{margin:0;padding-left:1.3em;display:grid;gap:4px}
.reset{justify-self:center;background:none;border:0;color:var(--muted);text-decoration:underline;font-size:13px}
.backup{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:10px}
.file{display:inline-flex;align-items:center;min-height:44px;border:1.5px solid var(--line);border-radius:10px;padding:6px 14px;font-weight:700;cursor:pointer;background:var(--card)}
.file input{position:absolute;opacity:0;width:1px;height:1px}
.phead{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding-top:12px;flex-wrap:wrap}
.phead .sec{font-weight:700;color:var(--grid)}
.phead .cnt{color:var(--muted);font-variant-numeric:tabular-nums}
.track{height:7px;background:var(--line);border-radius:4px;overflow:hidden}
.track i{display:block;height:100%;background:var(--grid)}
.prompt{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 16px;display:grid;gap:6px;justify-items:center;text-align:center}
.prompt .zy{font-size:30px;font-weight:700;letter-spacing:.12em;color:var(--blue)}
.prompt .words{display:flex;gap:8px 18px;flex-wrap:wrap;justify-content:center;font-family:var(--f-kai);font-size:26px}
.prompt .words .blank{display:inline-block;min-width:1.1em;border-bottom:3px solid var(--grid);color:transparent}
.prompt .words .shown{color:var(--grid)}
.prompt .note{font-size:13px;color:var(--muted);font-family:var(--f-body)}
.prompt .clock{font-size:14px;font-weight:700;color:var(--gold);font-variant-numeric:tabular-nums}
.boardwrap{display:grid;justify-items:center;gap:10px}
.board{position:relative;width:min(100%,520px,calc(100dvh - 300px));min-width:min(100%,280px);aspect-ratio:1;border:3px solid var(--grid);background:var(--card);border-radius:4px;touch-action:none;
  background-image:repeating-linear-gradient(90deg,var(--grid-soft) 0 6px,transparent 6px 12px),repeating-linear-gradient(0deg,var(--grid-soft) 0 6px,transparent 6px 12px);
  background-size:100% 2px,2px 100%;background-position:0 50%,50% 0;background-repeat:no-repeat}
.board .ghost{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--f-kai);font-size:min(78vw,400px,calc((100dvh - 300px)*.78));line-height:1;color:var(--ink);opacity:.14;pointer-events:none;user-select:none}
.board canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:crosshair}
.tools{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.mini{background:var(--card);border:1.5px solid var(--line);border-radius:8px;padding:8px 14px;font-size:15px}
.mini.on{background:var(--gold-soft);border-color:var(--gold);color:var(--gold);font-weight:700}
.check{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:grid;gap:12px}
.compare{display:grid;grid-template-columns:1fr 1fr;gap:12px;justify-items:center;text-align:center}
.compare .cap{font-size:13px;color:var(--muted)}
.cell{width:min(38vw,170px);aspect-ratio:1;border:2px solid var(--grid);background:var(--card);position:relative;
  background-image:repeating-linear-gradient(90deg,var(--grid-soft) 0 4px,transparent 4px 8px),repeating-linear-gradient(0deg,var(--grid-soft) 0 4px,transparent 4px 8px);
  background-size:100% 1px,1px 100%;background-position:0 50%,50% 0;background-repeat:no-repeat}
.cell img{position:absolute;inset:0;width:100%;height:100%}
.cell .kai{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--f-kai);font-size:min(30vw,136px);line-height:1;color:var(--ink)}
.judge{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.judge .btn[aria-pressed="true"].green{background:var(--green);color:var(--on)}
.judge .btn[aria-pressed="true"].red{background:var(--red);color:var(--on)}
.tipbox{font-size:14px;color:var(--muted);text-align:center}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:9;background:var(--card);border-top:2px solid var(--line);padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.bar .in{max-width:760px;margin:0 auto;display:grid;grid-template-columns:1fr auto 1.3fr;gap:10px;align-items:center}
.nav{min-height:52px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);font-weight:700;padding:6px 10px}
.nav.primary{background:var(--grid);border-color:var(--grid);color:var(--on)}
.nav.wait{opacity:.45;pointer-events:none}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.pitem{background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:8px;display:grid;gap:6px;justify-items:center}
.pitem.ok{border-color:var(--green)} .pitem.bad{border-color:var(--red)}
.pair{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:4px;width:100%}
.pair .cell{width:100%}
.pair .cell .kai{font-size:44px}
.pitem .zy{font-size:12px;color:var(--muted)}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;width:100%}
.seg button{border:1.5px solid var(--line);background:var(--card);border-radius:6px;font-size:13px;padding:4px}
.seg button.ok[aria-pressed="true"]{background:var(--green);border-color:var(--green);color:var(--on)}
.seg button.bad[aria-pressed="true"]{background:var(--red);border-color:var(--red);color:var(--on)}
.empty{color:var(--muted);font-size:13px;display:grid;place-items:center;height:100%}
.filter{display:flex;gap:6px;flex-wrap:wrap}
.filter button{border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:4px 12px;font-size:14px}
.filter button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--card)}
.warn{background:var(--gold-soft);border-left:4px solid var(--gold);padding:10px 14px;border-radius:4px;font-size:15px}
dialog{border:0;border-radius:12px;padding:20px;width:min(92vw,420px);background:var(--card);color:var(--ink);box-shadow:0 20px 50px rgb(0 0 0 / .35)}
dialog::backdrop{background:rgb(20 20 20 / .55)}
.drow{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
[hidden]{display:none!important}
@media (max-width:480px){.cta{grid-template-columns:1fr}.prompt .zy{font-size:26px}.prompt .words{font-size:22px}}
@media (prefers-reduced-motion:no-preference){.btn,.nav,.mini{transition:background .15s,border-color .15s}}
</style>
</head>

<header class="top">
  <button class="link" id="homeBtn" type="button" hidden>← 回目錄</button>

</header>
<div class="wrap" id="app"></div>
<footer class="bar" id="bar" hidden></footer>
<dialog id="dlg"><div id="dlgBody"></div></dialog>

const KEY='hanziWrite.v2', LOCK_MS=600, ROUND=30, EXAM_N=30, TIME_LIMIT=90;
const RANGES={final:{name:'期末',sub:'第七～十二課'},mid:{name:'期中',sub:'第一～六課'},all:{name:'全部',sub:'第一～十二課'}};
const MODES={normal:{name:'一般',tip:'看注音和語詞寫字，想不起來可以按描紅提示。'},trace:{name:'描紅',tip:'格子裡會有淡淡的字讓你照著描，不對答案、不記錄，適合先熟悉字形。'},adv:{name:'進階',tip:'只看注音、不給語詞和提示，每字限時 90 秒（時間到還是可以寫完）。'}};
const ALL=[];LESSONS.forEach((l,li)=>l.c.forEach(([ch,zy,words])=>ALL.push({ch,zy,words,li,id:li+'-'+ch})));
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const numCls=n=>n.length>1?'lnum s':'lnum';
let db=load();
function load(){try{const d=JSON.parse(localStorage.getItem(KEY));if(d&&d.c)return d}catch(e){}return{c:{}}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(db));$('saved').textContent='已自動儲存'}catch(e){$('saved').textContent='這個瀏覽器無法儲存'}}
db.range=RANGES[db.range]?db.range:'final';db.mode=MODES[db.mode]?db.mode:'normal';db.rounds=db.rounds||{};
const inRange=it=>db.range==='all'||LESSONS[it.li].term===db.range;
const pool=()=>ALL.filter(inRange);
const rec=it=>db.c[it.id];
const isBad=it=>rec(it)&&rec(it).mark==='bad';
const isOk=it=>rec(it)&&rec(it).mark==='ok';
function itById(id){return ALL.find(i=>i.id===id)}

// 每次打開網頁就抽一組新的 30 字；盡量避開上一組抽過的字，連續兩次不會重複（期中、期末、全部各自一組）
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function newRound(){
  const old=db.rounds[db.range],prev=(old&&old.ids)||[],P=pool();
  const ids=shuffle(P.filter(i=>!prev.includes(i.id)).map(i=>i.id)).slice(0,ROUND);
  if(ids.length<ROUND)ids.push(...shuffle(prev.filter(id=>!ids.includes(id))).slice(0,ROUND-ids.length));
  db.rounds[db.range]={ids:shuffle(ids),start:Date.now(),n:(old?old.n||0:0)+1};save();
}
const R=()=>db.rounds[db.range];
function doneInRound(id){const r=db.c[id];return r&&r.t>=R().start}
let onStroke=()=>paintBar();
const diag=[];
let view={name:'home'}, lockUntil=0, lockT=null, timerT=null;
function go(v){view=v;render();window.scrollTo(0,0)}
function render(){
  clearInterval(timerT);
  $('bar').hidden=true;$('homeBtn').hidden=view.name==='home';
  onStroke=()=>paintBar();
  ({home,write,parent,exam,grade,examResult})[view.name]();
}

/* ---------- 首頁 ---------- */
function home(){
  $('topTitle').textContent='國語生字手寫本';
  if(!R())newRound();
  const P=pool(),ok=P.filter(isOk).length,bad=P.filter(isBad).length,n=P.length,G=RANGES[db.range];
  const rIts=R().ids.map(itById),rDone=rIts.filter(it=>doneInRound(it.id)),allDone=rDone.length===rIts.length,rBad=rDone.filter(isBad).length;
  let h=`<div class="hero"><h1>國語生字手寫本</h1><p>六上${G.name}・${G.sub}共 ${n} 個生字。每次打開都會隨機抽 ${ROUND} 個字來寫，每一次都不一樣。</p></div>
  <div class="setbox">
   <div class="setrow"><span>範圍</span><div class="pills" role="group" aria-label="範圍">${Object.entries(RANGES).map(([k,v])=>`<button type="button" data-range="${k}" aria-pressed="${db.range===k}">${v.name}（${v.sub}）</button>`).join('')}</div></div>
   <div class="setrow"><span>練習方式</span><div class="pills" role="group" aria-label="練習方式">${Object.entries(MODES).map(([k,v])=>`<button type="button" data-mode="${k}" aria-pressed="${db.mode===k}">${v.name}</button>`).join('')}</div></div>
   <p class="modehint">${MODES[db.mode].tip}</p>
  </div>
  <div class="today"><div class="row"><h2>這一次的 ${ROUND} 字</h2>${allDone?'<span class="stamp">完成</span>':`<b style="font-size:20px;font-variant-numeric:tabular-nums">${rDone.length} / ${ROUND} 字</b>`}</div>
   <div class="chips" aria-label="這一次要寫的字">${rIts.map(it=>{const d=doneInRound(it.id);return `<span class="chip ${d?(isOk(it)?'ok':'bad'):'todo'}">${d?esc(it.ch):'？'}</span>`}).join('')}</div>
   <p style="font-size:14px;color:var(--muted)">${allDone?`這一組寫完了，寫對 ${rDone.length-rBad} 字${rBad?`、錯 ${rBad} 字（已放進錯字本）`:''}。想再練可以抽一組新的字。`:'字是抽籤抽出來的，寫的時候才會知道是哪一個。'}</p>
   ${allDone?'':`<button class="btn primary" id="goRound" type="button">${rDone.length?'繼續寫這一組 →':`開始寫這 ${ROUND} 字 →`}</button>`}
   <button class="btn" id="reRound" type="button">${allDone?`抽一組新的 ${ROUND} 字 →`:`換一組新的 ${ROUND} 字`}</button></div>
  <details class="more"><summary>${G.name}進度：已寫 ${ok+bad} / ${n} 字</summary><div style="display:grid;gap:8px;margin-top:10px">
  <div class="meter" aria-hidden="true"><i class="ok" style="width:${ok/n*100}%"></i><i class="bad" style="width:${bad/n*100}%"></i></div>
  <div class="legend"><span class="lo">寫對 ${ok}</span><span class="lb">寫錯 ${bad}（在錯字本）</span><span>還沒寫 ${n-ok-bad}</span></div></div></details>
  <div class="cta">
    <button class="btn red" id="goBad" type="button" ${bad?'':'disabled'}>錯字本：再寫 ${bad} 字</button>
    <button class="btn" id="goAll" type="button">一口氣寫全部 ${n} 字</button>
  </div>
  <label class="chk"><input type="checkbox" id="triple" ${db.triple?'checked':''}> 錯字本每個字連寫三次</label>
  ${examCard()}
  <h2 style="font-size:19px">分課練習</h2><div class="lessons">`;
  LESSONS.forEach((l,li)=>{
    if(db.range!=='all'&&l.term!==db.range)return;
    const its=ALL.filter(it=>it.li===li),w=its.filter(rec).length,b=its.filter(isBad).length;
    const badge=!w?'<span class="badge">還沒寫</span>':w<its.length?`<span class="badge">寫了 ${w}/${its.length}</span>`:b?`<span class="badge fix">錯 ${b} 字</span>`:'<span class="badge done">全對 ★</span>';
    h+=`<button class="lesson" type="button" data-l="${li}"><span class="${numCls(l.n)}">${l.n}</span><span><h3>${esc(l.t)}</h3><small>${its.length} 字・${its.slice(0,8).map(i=>i.ch).join('')}…</small></span>${badge}</button>`;
  });
  h+=`</div>
  <button class="btn green" id="goParent" type="button">給家長看：檢查孩子寫的字</button>
  <div class="how"><b>怎麼寫</b><ol>
   <li>先選範圍（期末、期中或全部）和練習方式。每次打開都會隨機抽 ${ROUND} 字，按「開始寫」。</li>

/* ---------- 寫字頁 ---------- */
let strokes=[],cur=null,ctx=null,cv=null,checked=false,hint=false,mark=null,shot=null;
function wordsHtml(it){return it.words.map(w=>[...w].map(c=>c===it.ch?'<span class="blank">'+c+'</span>':esc(c)).join('')).map(w=>`<span>${w}</span>`).join('')}
function write(){
  const q=view.queue;if(!q.length)return go({name:'home'});
  view.at=Math.min(view.at,q.length-1);
  const it=itById(q[view.at]),mode=view.mode||'normal';
  strokes=[];cur=null;checked=false;hint=mode==='trace';mark=null;shot=null;
  $('topTitle').textContent=view.label+(mode==='normal'?'':`（${MODES[mode].name}）`);
  const L=LESSONS[it.li],r=rec(it);
  const note=mode==='trace'?'照著淡淡的字描一遍，寫完按「下一字」':mode==='adv'?'進階：只看注音寫出國字':r?(r.mark==='ok'?'上次寫對了':'上次寫錯了，這次加油'):'畫底線的地方就是要寫的字';
  $('app').innerHTML=`
  <div class="phead"><span class="sec">第${L.n}課・${esc(L.t)}</span><span class="cnt">第 ${view.at+1} / ${q.length} 字</span></div>
  <div class="track"><i style="width:${view.at/q.length*100}%"></i></div>
  <div class="prompt"><span class="zy">${esc(it.zy)}</span>${mode==='adv'?'':`<div class="words" id="words">${wordsHtml(it)}</div>`}
   <span class="note">${note}</span>${mode==='adv'?`<span class="clock" id="clock">剩 ${TIME_LIMIT} 秒</span>`:''}</div>
  <div class="boardwrap" id="bw">
   <div class="board" id="board"><div class="ghost" id="ghost" ${hint?'':'hidden'}>${esc(it.ch)}</div><canvas id="cv" aria-label="田字格，在這裡寫「${esc(it.zy)}」"></canvas></div>
   <div class="tools"><button class="mini" id="undo" type="button">↶ 擦掉一筆</button><button class="mini" id="clear" type="button">全部擦掉</button>${mode==='normal'?'<button class="mini" id="hintBtn" type="button" aria-pressed="false">描紅提示</button>':''}</div>
   <button class="link" id="diagBtn" type="button" style="font-size:13px">寫不出來？按這裡看看</button><pre id="diag" hidden style="font-size:12px;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px;margin:0;white-space:pre-wrap;min-height:3em"></pre>
  </div>
  <div class="check" id="check" hidden></div>`;
  setupCanvas();
  $('undo').onclick=()=>{strokes.pop();redraw();paintBar()};
  $('clear').onclick=()=>{strokes=[];redraw();paintBar()};
  $('diagBtn').onclick=()=>{const d=$('diag');d.hidden=!d.hidden;d.textContent=diag.length?diag.join('\n'):'在格子裡用手指寫一筆，這裡會顯示網頁收到的動作。請把這裡的字拍給 Claude。'};
  if($('hintBtn'))$('hintBtn').onclick=()=>{hint=!hint;$('ghost').hidden=!hint;$('hintBtn').classList.toggle('on',hint);$('hintBtn').setAttribute('aria-pressed',hint)};
  if(mode==='adv'){let left=TIME_LIMIT;timerT=setInterval(()=>{left--;const c=$('clock');if(!c||checked)return clearInterval(timerT);c.textContent=left>0?`剩 ${left} 秒`:'時間到了，寫完再對答案';if(left<=0)clearInterval(timerT)},1000)}
  paintBar();
}
function setupCanvas(){
  cv=$('cv');ctx=cv.getContext('2d');
  const size=()=>{const r=cv.getBoundingClientRect(),dpr=window.devicePixelRatio||1;cv.width=Math.round(r.width*dpr);cv.height=Math.round(r.height*dpr);redraw()};
  size();
  if(window.ResizeObserver)new ResizeObserver(size).observe(cv);
  const pt=e=>{const r=cv.getBoundingClientRect();return[(e.clientX-r.left)/r.width,(e.clientY-r.top)/r.height]};
  const begin=p=>{if(checked)return false;cur=[p];strokes.push(cur);redraw();return true};
  const move=ps=>{if(!cur)return;ps.forEach(p=>cur.push(p));redraw()};
  const finish=()=>{if(!cur)return;if(cur.length===1)cur.push([cur[0][0]+.004,cur[0][1]+.004]);cur=null;redraw();onStroke()};
  // 手指一律用觸控事件（Android Chrome 最穩定），觸控筆和滑鼠用 Pointer Events
  let pid=null,penActive=false,tid=null;
  const log=m=>{diag.push(m);if(diag.length>8)diag.shift();const d=$('diag');if(d&&!d.hidden)d.textContent=diag.join('\n')};
  if(window.PointerEvent){
    cv.addEventListener('pointerdown',e=>{
      log('pointerdown '+e.pointerType);
      if(e.pointerType==='touch')return;
      e.preventDefault();
      if(cur)finish();
      if(!begin(pt(e)))return;
      pid=e.pointerId;penActive=e.pointerType==='pen';try{cv.setPointerCapture(pid)}catch(_){}
    });
    cv.addEventListener('pointermove',e=>{if(e.pointerId!==pid||e.pointerType==='touch')return;const evs=e.getCoalescedEvents?e.getCoalescedEvents():[];move((evs.length?evs:[e]).map(pt));e.preventDefault()});
    const end=e=>{if(e.pointerId!==pid)return;pid=null;setTimeout(()=>penActive=false,500);finish()};
    cv.addEventListener('pointerup',end);cv.addEventListener('pointercancel',e=>{log('pointercancel '+e.pointerType);end(e)});cv.addEventListener('lostpointercapture',end);
  }else{
    cv.addEventListener('mousedown',e=>{begin(pt(e));const mm=ev=>move([pt(ev)]),mu=()=>{finish();removeEventListener('mousemove',mm);removeEventListener('mouseup',mu)};addEventListener('mousemove',mm);addEventListener('mouseup',mu)});
  }
  const find=(list,id)=>{for(const t of list)if(t.identifier===id)return t;return null};
  cv.addEventListener('touchstart',e=>{
    if(e.cancelable)e.preventDefault();
    log('touchstart x'+e.touches.length);
    if(penActive||pid!==null)return;   // 觸控筆正在寫：手掌不算
    if(tid!==null)return;               // 已經有一根手指在寫：其他手指／手掌不算
    const t=e.changedTouches[0];
    if(!begin(pt(t)))return;
    tid=t.identifier;
  },{passive:false});
  cv.addEventListener('touchmove',e=>{if(e.cancelable)e.preventDefault();if(tid===null)return;const t=find(e.changedTouches,tid);if(t)move([pt(t)])},{passive:false});
  const tend=e=>{if(tid===null)return;if(find(e.changedTouches,tid)){tid=null;finish()}};
  cv.addEventListener('touchend',e=>{if(e.cancelable)e.preventDefault();tend(e)},{passive:false});
  cv.addEventListener('touchcancel',e=>{log('touchcancel');tend(e)});
  cv.addEventListener('contextmenu',e=>e.preventDefault());
  cv.parentElement.addEventListener('touchmove',e=>{if(e.cancelable)e.preventDefault()},{passive:false});
}
function penColor(){return getComputedStyle(document.documentElement).getPropertyValue('--pen').trim()||'#1b2a3a'}
function drawStrokes(c,w,h,list,color){
  c.clearRect(0,0,w,h);c.lineCap='round';c.lineJoin='round';c.strokeStyle=color;c.lineWidth=Math.max(4,w*.045);
  list.forEach(s=>{if(s.length<2)return;c.beginPath();c.moveTo(s[0][0]*w,s[0][1]*h);
    for(let i=1;i<s.length-1;i++){const mx=(s[i][0]+s[i+1][0])/2*w,my=(s[i][1]+s[i+1][1])/2*h;c.quadraticCurveTo(s[i][0]*w,s[i][1]*h,mx,my)}
    const l=s[s.length-1];c.lineTo(l[0]*w,l[1]*h);c.stroke()});
}
function redraw(){if(ctx)drawStrokes(ctx,cv.width,cv.height,strokes,penColor())}
function snapshot(){const c=document.createElement('canvas');c.width=c.height=160;drawStrokes(c.getContext('2d'),160,160,strokes,'#1b2a3a');return c.toDataURL('image/png')}
function lock(){lockUntil=Date.now()+LOCK_MS;const b=$('nextBtn');if(b)b.classList.add('wait');clearTimeout(lockT);lockT=setTimeout(()=>{const n=$('nextBtn');if(n)n.classList.remove('wait')},LOCK_MS)}
function paintBar(){
  const q=view.queue,last=view.at===q.length-1,trace=view.mode==='trace';
  let right;
  if(trace) right=`<button class="nav primary${Date.now()<lockUntil?' wait':''}" id="nextBtn" type="button" ${strokes.length?'':'disabled'}>${last?'完成 ✓':'下一字 →'}</button>`;
  else if(!checked) right=`<button class="nav primary" id="nextBtn" type="button" ${strokes.length?'':'disabled'}>寫好了，對答案</button>`;
  else right=`<button class="nav primary${Date.now()<lockUntil?' wait':''}" id="nextBtn" type="button" ${mark?'':'disabled'}>${last?'完成 ✓':'下一字 →'}</button>`;
  $('bar').innerHTML=`<div class="in"><button class="nav" id="prevBtn" type="button" ${view.at?'':'disabled'}>← 上一字</button>
   <button class="nav" id="skipBtn" type="button">${checked?'重寫':'先跳過'}</button>${right}</div>`;
  $('bar').hidden=false;
  $('prevBtn').onclick=()=>{view.at--;go(view)};
  $('skipBtn').onclick=()=>{if(checked){go(view)}else if(last){finishRound()}else{view.at++;go(view)}};
  $('nextBtn').onclick=()=>{

function reveal(){

   <p class="tipbox">一筆一筆比比看：部首對嗎？有沒有多一畫、少一畫？${hint?'<br>（這次有用描紅提示）':''}</p>
   <div class="judge"><button class="btn green" id="mOk" type="button" aria-pressed="false">✓ 我寫對了</button><button class="btn red" id="mBad" type="button" aria-pressed="false">✕ 寫錯了，加入錯字本</button></div>`;

function finishRound(){

}

/* ---------- 最終測驗 ---------- */

  else state=`<button class="btn" id="exNew" type="button">開始${G.name}最終測驗 →</button>`;
  return `<div class="examcard"><h2>最終測驗</h2><p>從${G.name}的 ${pool().length} 字隨機抽 ${EXAM_N} 字，沒有描紅、沒有提示、寫的時候不能看答案。全部寫完交卷，由家長批改，滿分 100 分。</p>
   ${hist.length?`<div class="hist">${hist.map(h=>`<span>${h.d}${h.r?' '+h.r:''}　${h.s} 分</span>`).join('')}</div>`:''}${state}</div>`;

function bindExamCard(){

    const start=()=>{db.exam={status:'writing',range:db.range,ids:shuffle(pool().map(i=>i.id)).slice(0,EXAM_N),strokes:Array(EXAM_N).fill(null),start:Date.now()};save();go({name:'exam',at:0})};

  <div class="track"><i style="width:${done/EXAM_N*100}%"></i></div>

   <div class="tools"><button class="mini" id="undo" type="button">↶ 擦掉一筆</button><button class="mini" id="clear" type="button">全部擦掉</button><button class="mini" id="mapBtn" type="button">題號表</button></div></div>

function examBar(){

function submitExam(){
  const E=db.exam,empty=E.strokes.filter(x=>!x||!x.length).length;
  confirmBox('確定要交卷嗎？',`${empty?`還有 <b>${empty}</b> 題沒寫，沒寫的算錯。`:`${EXAM_N} 題都寫了。`}交卷後就不能再改。`,'確定交卷',()=>{
    E.imgs=E.strokes.map(st=>{strokes=st||[];return strokes.length?snapshot():null});
    E.marks=E.imgs.map(im=>im?null:'bad');E.status='grading';delete E.strokes;E.end=Date.now();save();
    go({name:'grade'});
  },'再檢查一下');
}
function grade(){
  const E=db.exam;if(!E||E.status!=='grading')return go({name:'home'});
  $('topTitle').textContent='家長批改';
  const left=E.marks.filter(m=>m===null).length;
  let h=`<div class="hero"><h1 style="font-size:28px">家長批改</h1><p>左邊是孩子寫的，右邊是課本的字。部首、筆畫、多一畫少一畫都要對，才算對。每一題點「對」或「錯」，全部批完就會算分數。沒寫的題目已經自動算錯。</p></div><div class="pgrid">`;
  E.ids.forEach((id,k)=>{const it=itById(id),m=E.marks[k];
    h+=`<div class="gitem ${m||''}"><span class="no">第 ${k+1} 題・${esc(it.zy)}・${esc(it.words[0])}</span><div class="pair"><div class="cell">${E.imgs[k]?`<img src="${E.imgs[k]}" alt="孩子寫的第 ${k+1} 題">`:'<span class="empty">沒寫</span>'}</div><div class="cell"><span class="kai">${esc(it.ch)}</span></div></div>
    ${E.imgs[k]?`<div class="seg"><button type="button" class="ok" data-k="${k}" data-m="ok" aria-pressed="${m==='ok'}">對</button><button type="button" class="bad" data-k="${k}" data-m="bad" aria-pressed="${m==='bad'}">錯</button></div>`:''}</div>`});
  h+='</div>';
  $('app').innerHTML=h;
  document.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{E.marks[+b.dataset.k]=b.dataset.m;save();const y=scrollY;render();scrollTo(0,y)});
  $('bar').innerHTML=`<div class="in" style="grid-template-columns:1fr"><button class="nav primary" id="doneBtn" type="button" ${left?'disabled':''}>${left?`還有 ${left} 題沒批改`:'批改完成，看分數 →'}</button></div>`;
  $('bar').hidden=false;
  $('doneBtn').onclick=()=>{
    const ok=E.marks.filter(m=>m==='ok').length,score=Math.round(ok/EXAM_N*100);
    E.ids.forEach((id,k)=>{db.c[id]={mark:E.marks[k],img:E.imgs[k]||(db.c[id]&&db.c[id].img)||'',hint:false,t:Date.now()}});
    const d=new Date();db.examHist=(db.examHist||[]).concat({d:`${d.getMonth()+1}/${d.getDate()}`,r:RANGES[E.range]?.name||'',s:score,ok});
    E.status='done';E.score=score;E.ok=ok;save();go({name:'examResult'});
  };
}
function examResult(){
  const E=db.exam;if(!E||E.status!=='done')return go({name:'home'});
  $('topTitle').textContent='測驗成績';
  const wrong=E.ids.map((id,k)=>[itById(id),k]).filter(([,k])=>E.marks[k]!=='ok');
  const msg=E.score===100?'全部寫對，太厲害了！':E.score>=80?'寫得很好！錯的字再多練幾次就更穩了。':E.score>=60?'有進步空間，錯的字已經放進錯字本，記得去練。':'錯的字有點多，先用錯字本把它們練熟，再來挑戰一次。';
  let h=`<div class="score"><div class="stampbig">${E.score}</div><p><b>${RANGES[E.range]?.name||''}最終測驗</b><br>寫對 ${E.ok} / ${EXAM_N} 字。${msg}</p></div>`;
  if(wrong.length)h+=`<h2 style="font-size:19px">寫錯的 ${wrong.length} 個字（已加入錯字本）</h2><div class="pgrid">${wrong.map(([it,k])=>`<div class="gitem bad"><span class="no">${esc(it.zy)}・${esc(it.words.join('、'))}</span><div class="pair"><div class="cell">${E.imgs[k]?`<img src="${E.imgs[k]}" alt="孩子寫的">`:'<span class="empty">沒寫</span>'}</div><div class="cell"><span class="kai">${esc(it.ch)}</span></div></div></div>`).join('')}</div>`;
  $('app').innerHTML=h;
  $('bar').innerHTML=`<div class="in" style="grid-template-columns:1fr 1fr"><button class="nav" id="bHome" type="button">回目錄</button><button class="nav primary" id="bBad" type="button" ${wrong.length?'':'disabled'}>馬上練錯字 →</button></div>`;
  $('bar').hidden=false;
  $('bHome').onclick=()=>go({name:'home'});
  $('bBad').onclick=()=>go({name:'write',queue:wrong.map(([it])=>it.id),at:0,label:'測驗錯字',mode:'normal'});
}

/* ---------- 家長頁 ---------- */
function parent(){
  $('topTitle').textContent='家長檢查';
  const f=view.filter,P=pool();
  const list=P.filter(it=>f==='all'||(f==='written'&&rec(it))||(f==='bad'&&isBad(it))||(f==='ok'&&isOk(it)));
  let h=`<div class="hero"><h1 style="font-size:28px">家長檢查</h1><p>左邊是孩子寫的，右邊是課本的字。孩子是自己判斷對錯的，看到判斷不對的，直接點下面的按鈕改掉，錯字本會跟著更新。（目前範圍：${RANGES[db.range].name}）</p></div>
  <div class="filter" role="group" aria-label="篩選">${[['written','寫過的'],['bad','寫錯的'],['ok','寫對的'],['all',`全部 ${P.length} 字`]].map(([k,t])=>`<button type="button" data-f="${k}" aria-pressed="${f===k}">${t}</button>`).join('')}</div>`;
  if(!list.length)h+=`<p class="warn">這裡還沒有字。孩子寫過之後就會出現。</p>`;
  let lastL=-1;
  list.forEach(it=>{
    if(it.li!==lastL){if(lastL>=0)h+='</div>';h+=`<h2 style="font-size:18px;margin-top:6px">第${LESSONS[it.li].n}課 ${esc(LESSONS[it.li].t)}</h2><div class="pgrid">`;lastL=it.li}
    const r=rec(it);
    h+=`<div class="pitem ${r?r.mark:''}"><div class="pair"><div class="cell">${r&&r.img?`<img src="${r.img}" alt="孩子寫的「${esc(it.zy)}」">`:'<span class="empty">沒寫</span>'}</div><div class="cell"><span class="kai">${esc(it.ch)}</span></div></div>
    <span class="zy">${esc(it.zy)}・${esc(it.words[0])}${r&&r.hint?'・有看提示':''}</span>
    ${r?`<div class="seg"><button type="button" class="ok" data-id="${it.id}" data-m="ok" aria-pressed="${r.mark==='ok'}">對</button><button type="button" class="bad" data-id="${it.id}" data-m="bad" aria-pressed="${r.mark==='bad'}">錯</button></div>`:''}</div>`;
  });
  if(lastL>=0)h+='</div>';
  $('app').innerHTML=h;
  document.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{view.filter=b.dataset.f;render()});
  document.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{const r=db.c[b.dataset.id];r.mark=b.dataset.m;save();const y=window.scrollY;render();window.scrollTo(0,y)});
}

/* ---------- 對話框 ---------- */
function confirmBox(title,msg,yesText,yes,noText='取消',no){
  const d=$('dlg');
  $('dlgBody').innerHTML=`<h3 style="font-size:19px;margin-bottom:8px">${title}</h3><p>${msg}</p><div class="drow" style="${yesText?'':'grid-template-columns:1fr'}"><button class="btn" id="dNo" type="button">${noText}</button>${yesText?`<button class="btn primary" id="dYes" type="button">${yesText}</button>`:''}</div>`;
  d.showModal();$('dNo').focus();
  $('dNo').onclick=()=>{d.close();if(no)no()};
  if(yesText)$('dYes').onclick=()=>{d.close();yes()};
}
$('homeBtn').onclick=()=>go({name:'home'});
newRound();
render();
if('serviceWorker' in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script>
</body>
